remote_theme: simplonco/simplonline-ressources-jekyll-theme

title: "CSS 6 : Responsive Design & Media queries"
description: "Des mises en pages adaptées à tous les supports. Découvre les objectifs et la pratique du responsive design."
github_org: simplonco
lang: fr

show_toc: true

readme_index:
  with_frontmatter: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-stepper
